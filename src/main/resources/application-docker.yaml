spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-app:8080}
          predicates:
            - Path=/api/v1/users/**

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-app:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-app:8082}
          predicates:
            - Path=/api/v1/orders/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-app:8083}
          predicates:
            - Path=/api/v1/payments/**

application:
  security:
    jwt:
