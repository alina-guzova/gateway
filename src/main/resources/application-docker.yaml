spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-app:8080
          predicates:
            - Path=/api/v1/users/**

        - id: auth-service
          uri: http://auth-app:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: order-service
          uri: http://order-app:8082
          predicates:
            - Path=/api/v1/orders/**

